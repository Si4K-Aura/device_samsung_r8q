name: Build TWRP r8q

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 python-is-python3 rsync bc lz4 \
            liblz4-tool libssl-dev ccache

      - name: Restore ccache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ~/.ccache
          key: ccache-r8q-${{ github.run_id }}
          restore-keys: |
            ccache-r8q-

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP minimal manifest
        run: |
          git config --global user.name "r8q-builder"
          git config --global user.email "r8q-builder@localhost"
          git config --global color.ui false
          mkdir -p "$HOME/twrp"
          cd "$HOME/twrp"
          repo init --depth=1 --no-clone-bundle -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags
          df -h /

      - name: Add device tree
        run: |
          git clone --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$HOME/device_tree"
          rm -rf "$HOME/device_tree/.git" "$HOME/device_tree/.github"
          mkdir -p "$HOME/twrp/device/samsung/r8q"
          cp -r "$HOME/device_tree/." "$HOME/twrp/device/samsung/r8q/"
          ls -la "$HOME/twrp/device/samsung/r8q"

      - name: Apply AMOLED theme
        run: |
          ls "$HOME/twrp/bootable/recovery/gui/theme"
          python3 "$HOME/device_tree/tools/amoled_theme.py" \
            "$HOME/twrp/bootable/recovery/gui/theme/common" \
            "$HOME/twrp/bootable/recovery/gui/theme/portrait_hdpi"

      - name: Build recovery
        run: |
          cd "$HOME/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_COMPILERCHECK=content
          ccache -M 5G
          ccache -z
          set +e
          source build/envsetup.sh
          lunch twrp_r8q-eng
          mka recoveryimage
          set -e
          ccache -s
          ls -lh out/target/product/r8q/
          test -f out/target/product/r8q/recovery.img

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ~/.ccache
          key: ccache-r8q-${{ github.run_id }}

      - name: Package for Odin
        run: |
          cp "$HOME/twrp/out/target/product/r8q/recovery.img" recovery.img
          SIZE=$(stat -c %s recovery.img)
          echo "image size: $SIZE bytes (partition limit: 82694144)"
          test "$SIZE" -le 82694144
          tar -H ustar -c recovery.img > recovery.tar
          ls -l recovery.img recovery.tar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "r8q-${{ github.run_number }}" recovery.img recovery.tar \
            --repo "$GITHUB_REPOSITORY" \
            --title "TWRP r8q build ${{ github.run_number }}" \
            --notes "Recovery for Galaxy S20 FE 5G (r8q). Flash recovery.tar with Odin in the AP slot."
